<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Trazabilidad - Centro de Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --neon: #60a5fa;
            --secondary: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cabecera Premium */
        header {
            padding: 20px 40px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        .search-container input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 10px 45px 10px 20px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .search-container button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--neon);
            border: none;
            color: black;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        #digital-clock {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #60a5fa, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.4);
        }

        /* Layout Grid */
        .main-dashboard {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 120px);
        }

        .panel {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }

        h2 { font-size: 1.1rem; color: var(--secondary); margin-top: 0; display: flex; align-items: center; gap: 10px; }

        /* Centro: Grilla de Pedidos Activos */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .order-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .order-card:hover { border-color: var(--neon); background: rgba(96, 165, 250, 0.05); transform: translateY(-3px); }
        .order-card.active { border: 2px solid var(--neon); background: rgba(96, 165, 250, 0.1); }

        .order-nro { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .order-status { font-size: 0.8rem; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-bottom: 8px; }
        .status-pendiente { background: #64748b33; color: #94a3b8; }
        .status-ruta { background: #f59e0b33; color: #f59e0b; }
        .status-validado { background: #10b98133; color: #10b981; }

        .order-meta { font-size: 0.75rem; color: var(--secondary); display: flex; justify-content: space-between; }

        /* Izquierda: Timeline */
        .timeline { position: relative; padding-left: 20px; }
        .timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--border); }

        .timeline-item { margin-bottom: 25px; position: relative; }
        .timeline-dot { 
            position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%;
            background: var(--secondary); z-index: 2;
        }
        .timeline-content { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px; }
        .time-label { font-size: 0.7rem; color: var(--neon); font-weight: bold; }
        .event-name { font-size: 0.9rem; font-weight: 600; margin: 2px 0; }
        .event-detail { font-size: 0.75rem; color: var(--secondary); }

        /* Derecha: Conductores */
        .drivers-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .section-drivers {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 10px;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--secondary);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .driver-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .driver-info {
            display: flex;
            flex-direction: column;
        }
        
        .driver-actions {
            display: flex;
            gap: 5px;
        }

        .btn-bala {
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-bala:hover { transform: scale(1.05); }
        .btn-activar { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); }
        .btn-pausar { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-llego { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); }

        .status-pill { font-size: 0.65rem; font-weight: bold; padding: 3px 8px; border-radius: 20px; text-align: center; margin-top: 4px; display: inline-block; width: fit-content; }
        .status-available { background: #10b98133; color: #10b981; }
        .status-route { background: #f59e0b33; color: #f59e0b; }

        /* Estilos genéricos */
        .min-badge { background: rgba(96,165,250,0.1); color: var(--neon); font-size: 0.7rem; padding: 2px 6px; border-radius: 5px; float: right; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* --- COLA FIFO TURNOS DE SALIDA --- */
    .fifo-bar {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px 20px;
        margin-bottom: 20px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .fifo-title {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--primary);
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .fifo-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .fifo-badge {
        background: linear-gradient(135deg, var(--bg-card), #2a2a2a);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.2s;
        animation: slideIn 0.3s ease-out;
    }
    .fifo-badge:hover { transform: translateY(-2px); }
    .fifo-num {
        background: var(--primary);
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
    }
    .fifo-name { font-weight: 500; font-size: 0.9rem; color: #fff; }
    .fifo-time { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
    
    @keyframes slideIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    </style>
</head>
<body>

<header>
    <div>
        <h1 style="margin:0; font-size:1.4rem;">Panel de Trazabilidad</h1>
        <p style="margin:0; font-size:0.8rem; color:var(--secondary);">Mapa en Tiempo Real</p>
    </div>

    <div class="search-container">
        <input type="text" id="manual-search" placeholder="Nro o Llave (7094DE1NI)..." onkeypress="if(event.key==='Enter') buscarPedido()">
        <button onclick="buscarPedido()">MONITOREAR</button>
    </div>

    <div id="digital-clock">00:00:00</div>
</header>

<div class="main-dashboard">
    <!-- Panel Izquierdo: Línea de Tiempo Detallada -->
    <div class="panel">
        <h2><i class="fa-solid fa-clock-rotate-left"></i> Timeline <span id="current-order-id" style="color:white; margin-left:auto;">#----</span></h2>
        <div id="order-timeline" class="timeline">
            <div style="color:var(--secondary); font-size:0.9rem; text-align:center; padding-top:40px;">
                Selecciona un pedido para ver su detalle
            </div>
        </div>
        <button onclick="registrarLlegadaManual()" style="width:100%; margin-top:20px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:white; padding:10px; border-radius:12px; cursor:pointer;">
            <i class="fa-solid fa-store"></i> Marcar Llegada Tienda
        </button>
    </div>

    <!-- Panel Central: Mapa de Pedidos Activos -->
    <div class="panel">
        <h2><i class="fa-solid fa-list-check"></i> Pedidos del Día <span id="orders-count" style="margin-left:auto; font-size:0.8rem; background:rgba(255,255,255,0.1); padding:2px 10px; border-radius:10px;">0</span></h2>
        <div id="active-orders-grid" class="orders-grid">
            <div style="grid-column: 1/-1; text-align:center; padding:50px; color:var(--secondary);">
                Cargando mapa de pedidos...
            </div>
        </div>
    </div>

    <!-- Panel Derecho: Estado de Conductores -->
    <div class="panel">
        <h2><i class="fa-solid fa-motorcycle"></i> Flota Operativa <i id="drivers-loader" class="fa-solid fa-spinner fa-spin" style="display:none;font-size:0.8rem;margin-left:auto;"></i></h2>
        <div id="drivers-list" class="drivers-container">
            <!-- Cargando dinámicamente: DISPONIBLES, EN RUTA, NO PROGRAMADOS -->
            <div style="color:var(--secondary); text-align:center; padding:20px;">Cargando motorizados...</div>
        </div>
    </div>
</div>

<script src="trazabilidad.js"></script>
</body>
</html>
